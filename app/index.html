<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gestão Documental de Frota — controle documental multi-transportadora para TRRs e operações de combustíveis." />
  <title>Gestão Documental de Frota</title>
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">GD</div>
        <div>
          <h1>Gestão Documental de Frota</h1>
          <p>Controle documental multi-transportadora</p>
        </div>
      </div>
      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="login-email" value="admin@atualviapetro.com.br" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="login-password" value="demo" required />
        </label>
        <label class="field">
          <span>Empresa</span>
          <select id="login-company"></select>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p class="login-hint">Ambiente de demonstração — qualquer senha é aceita.</p>
      </form>
    </div>
    <p class="login-footer">© 2026 Gestão Documental de Frota · Plataforma genérica para TRRs</p>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">GD</div>
        <span class="brand-name">Gestão de Frota</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="company-pill" id="active-company">—</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-actions">
          <div class="alert-bell" id="alert-bell" title="Alertas de vencimento" role="button" tabindex="0" aria-label="Alertas de vencimento">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-count" id="bell-count">0</span>
          </div>
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">A</div>
            <div class="user-meta">
              <span class="user-name" id="user-name">Administrador</span>
              <span class="user-role" id="user-role">Admin</span>
            </div>
          </div>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
        </div>
      </header>

      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-root" class="modal-root hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal" id="modal">
      <div class="modal-head">
        <h3 id="modal-title">Título</h3>
        <button class="icon-btn" id="modal-close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
